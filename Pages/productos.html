<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Catálogo de productos VĀLI" />
  <title>Productos | VĀLI</title>

  <!-- Tus estilos -->
  <link rel="stylesheet" href="../css/style.css" />
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>

  <!-- SweetAlert2 -->
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <!-- Header -->
  <header class="d-flex justify-content-between align-items-center p-4 bg-white border-bottom">
    <img src="../images/vali-logo/vali-logo.png" alt="Logo de VĀLI" class="logo img-fluid" />
    <button id="btnCarrito" class="btn btn-primary">
      🛍️ <span class="badge badge-light" id="badge">0</span>
    </button>
  </header>

  <!-- Nav -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
      <li class="nav-item"><a class="nav-link active" href="./productos.html">Productos</a></li>
      <li class="nav-item"><a class="nav-link" href="./colecciones.html">Colecciones</a></li>
      <li class="nav-item"><a class="nav-link" href="./sobre_nosotros.html">Sobre Nosotros</a></li>
      <li class="nav-item"><a class="nav-link" href="./contactanos.html">Contáctanos</a></li>
    </ul>
  </nav>

  <main class="container my-4">
    <!-- Barra de búsqueda/filtros -->
    <section class="mb-3">
      <div class="form-row">
        <div class="col-12 col-md-6 mb-2">
          <input id="busqueda" class="form-control" placeholder="Buscar por nombre o descripción..." aria-label="Buscar productos" />
        </div>
        <div class="col-6 col-md-3 mb-2">
          <select id="filtroCat" class="form-control" aria-label="Filtrar por categoría">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="col-6 col-md-3 mb-2">
          <select id="orden" class="form-control" aria-label="Ordenar productos">
            <option value="">Ordenar…</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
            <option value="nombre-asc">Nombre: A → Z</option>
            <option value="nombre-desc">Nombre: Z → A</option>
          </select>
        </div>
      </div>
    </section>

  <!-- Contenedor vacío: el JS mete acá las cards -->
  <section class="row" id="gridProductos" aria-live="polite"></section>
</main>


    <!-- GRID: acá se insertan las cards con fotos -->
    <section class="row" id="gridProductos" aria-live="polite"></section>
  </main>

  <!-- Carrito -->
  <aside id="carrito" class="carrito-panel" aria-hidden="true">
    <div class="carrito-header d-flex justify-content-between align-items-center p-3 border-bottom">
      <h5 class="mb-0">Tu carrito</h5>
      <button id="cerrarCarrito" class="btn btn-secondary">Cerrar</button>
    </div>
    <div class="carrito-body p-3">
      <table class="table table-sm">
        <thead>
          <tr>
            <th>Producto</th>
            <th style="width: 170px;">Acciones</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="carritoBody">
          <tr><td colspan="3"><em>Tu carrito está vacío.</em></td></tr>
        </tbody>
      </table>
      <div class="d-flex justify-content-between align-items-center">
        <strong>Total:</strong>
        <span id="total">$ 0</span>
      </div>
    </div>
    <div class="carrito-footer p-3 border-top d-flex">
      <button id="vaciar" class="btn btn-secondary mr-2">Vaciar</button>
      <button id="comprar" class="btn btn-primary">Comprar</button>
    </div>
  </aside>

  <!-- Estilos rápidos para el carrito -->
  <style>
    .carrito-panel{
      position:fixed; top:0; right:0; height:100vh; width:380px;
      background:#fff; border-left:1px solid #eee; transform:translateX(100%);
      transition:transform .25s ease; z-index:1040; display:flex; flex-direction:column;
    }
    .carrito-panel.abierto{ transform:translateX(0); }
    .btn-min{ padding:.25rem .5rem; }
  </style>

  <!-- Tu JS -->
  <script defer src="../js/main.js"></script>
</body>
</html>
